name: Java CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
  GKE_ZONE: ${{ vars.GKE_ZONE }}

jobs:
  build-and-deploy:
    name: Build, Test and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java 17 and Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 3. Build application and run unit tests
      - name: Build and test with Maven
        run: mvn -B clean verify

      # 4. Authenticate with GCP using Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # 5. Set up Google Cloud SDK
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      # 6. Authenticate Docker with Artifact Registry
      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
            ${{ vars.GAR_LOCATION }}-docker.pkg.dev \
            --quiet

      # 7. Build and push Docker image
      - name: Build and push Docker image
        run: |
          IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/java-cicd-demo:${GITHUB_SHA}"
          LATEST="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/java-cicd-demo:latest"

          docker build -t "$IMAGE" -t "$LATEST" .

          docker push "$IMAGE"
          docker push "$LATEST"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # 8. Connect to GKE
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_ZONE }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # 9. Deploy application to Kubernetes
      - name: Deploy to GKE
        run: |
          sed "s|IMAGE_PLACEHOLDER|${IMAGE}|g" \
            k8s/deployment.yaml | kubectl apply -f -

          kubectl apply -f k8s/service.yaml

      # 10. Verify deployment
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/java-cicd-demo \
            --timeout=180s

          kubectl get deployments
          kubectl get pods
          kubectl get services
